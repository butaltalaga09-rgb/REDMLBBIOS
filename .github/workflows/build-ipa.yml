name: Build iOS IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'MLBB_iOS_Converter_Offline_Project.zip.part*'
      - 'patches/ios/**'
  push:
    branches: [main, master, windows-style-ios-ui]
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'MLBB_iOS_Converter_Offline_Project.zip.part*'
      - 'patches/ios/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and validate iOS project ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(MLBB_iOS_Converter_Offline_Project.zip.part*)
          if [ "${#parts[@]}" -ne 4 ]; then
            echo "::error::Expected all four ZIP chunks in repository root; found ${#parts[@]}."
            printf 'Found: %s\n' "${parts[@]}"
            exit 1
          fi
          cat "${parts[@]}" > MLBB_iOS_Converter_Offline_Project.zip
          unzip -t MLBB_iOS_Converter_Offline_Project.zip

      - name: Extract offline project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q MLBB_iOS_Converter_Offline_Project.zip -d source
          test -d source/MLBB_iOS_Converter_Offline_Project
          # ContentView uses NavigationStack and ShareLink, introduced in iOS 16.
          PROJECT_SPEC=source/MLBB_iOS_Converter_Offline_Project/project.yml
          python - "$PROJECT_SPEC" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          spec = path.read_text(encoding="utf-8")
          if '"15.0"' not in spec:
              raise SystemExit("Expected iOS 15 deployment target entries were not found.")
          spec = spec.replace('"15.0"', '"16.0"')
          # TrollStore reads these generated bundle version keys from Info.plist.
          marker = '        PRODUCT_NAME: ishamlbbios'
          if marker not in spec:
              raise SystemExit("Could not find the app target settings to set bundle versions.")
          spec = spec.replace(marker, marker + '\n        MARKETING_VERSION: "1.0.0"\n        CURRENT_PROJECT_VERSION: "1"\n        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"\n        INFOPLIST_KEY_CFBundleVersion: "1"')
          path.write_text(spec, encoding="utf-8")
          PY
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/MLBB_iOS_Converter_Offline_Project" >> "$GITHUB_ENV"

      - name: Apply repository iOS conversion crash fixes
        shell: bash
        run: |
          set -euo pipefail
          test -f patches/ios/mlbb_ios_bridge.py
          test -f patches/ios/ConverterBridge.m
          cp patches/ios/mlbb_ios_bridge.py "$PROJECT_DIR/PythonApp/mlbb_ios_bridge.py"
          cp patches/ios/ConverterBridge.m "$PROJECT_DIR/App/ConverterBridge.m"
          echo "Applied repository-maintained Python diagnostics and defensive native bridge."
          grep -q 'Stage 3/6: importing converter engine' "$PROJECT_DIR/PythonApp/mlbb_ios_bridge.py"
          grep -q 'Python argument tuple contains an uninitialized slot' "$PROJECT_DIR/App/ConverterBridge.m"

      - name: Apply Windows-style converter interface
        shell: bash
        run: |
          set -euo pipefail
          APP_SOURCE="$GITHUB_WORKSPACE/source/MLBB_iOS_Converter_Offline_Project/App"
          test -s patches/ios/ContentView.swift
          cp patches/ios/ContentView.swift "$APP_SOURCE/ContentView.swift"
          echo "Applied Windows-style iOS converter interface."
          grep -q 'CONVERT TO iOS' "$APP_SOURCE/ContentView.swift"
          grep -q 'Full texture validation' "$APP_SOURCE/ContentView.swift"
          grep -q 'Preserve shadows' "$APP_SOURCE/ContentView.swift"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/MLBB_iOS_Converter_Offline_Project/requirements-ios.txt

      - name: Install build tools
        run: brew install xcodegen ldid cmake ninja

      - name: Download embedded iOS Python framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p Vendor
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            https://github.com/beeware/Python-Apple-support/releases/download/3.12-b12/Python-3.12-iOS-support.b12.tar.gz \
            -o /tmp/Python-3.12-iOS-support.tar.gz
          tar -xzf /tmp/Python-3.12-iOS-support.tar.gz -C Vendor
          FRAMEWORK="$(find "$PROJECT_DIR/Vendor" -type d -name Python.xcframework -print -quit)"
          if [ -z "$FRAMEWORK" ]; then
            echo "Could not find Python.xcframework in the Python Apple-support archive." >&2
            find Vendor -maxdepth 4 -print | head -200
            exit 1
          fi
          if [ "$FRAMEWORK" != "$PROJECT_DIR/Vendor/Python.xcframework" ]; then
            rm -rf Vendor/Python.xcframework
            mv "$FRAMEWORK" Vendor/Python.xcframework
          fi
          test -d Vendor/Python.xcframework/ios-arm64/Python.framework
          echo "Prepared embedded Python.xcframework."

      - name: Run project and source checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python tools/check_ios_project.py

      - name: Prepare iOS cross-build environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 -m venv .host-build-venv
          . .host-build-venv/bin/activate
          python -m pip install --upgrade pip xbuild
          SYS_CONFIG="$(find Vendor/Python.xcframework/ios-arm64 -type f \
            \( -name '*sysconfig*iphoneos*' -o -name '*sysconfig*ios*arm64*' \) -print -quit)"
          if [ -z "$SYS_CONFIG" ]; then
            echo "Could not find the iOS ARM64 sysconfig file required for cross-building Python wheels." >&2
            find Vendor/Python.xcframework/ios-arm64 -type f \
              \( -name '*sysconfig*' -o -name 'sitecustomize.py' \) -print | head -100
            exit 1
          fi
          python -m venv .ios-venv
          python -m xvenv --sysconfig "$SYS_CONFIG" .ios-venv
          echo "IOS_SYS_CONFIG=$SYS_CONFIG" >> "$GITHUB_ENV"

      - name: Cross-build Python dependencies for iOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          source .ios-venv/bin/activate
          export PATH="$PROJECT_DIR/Vendor/Python.xcframework/ios-arm64/bin:$PATH"
          python -m pip install --upgrade pip setuptools wheel
          # Prevent macOS Homebrew libraries from leaking into iOS cross-builds.
          unset PKG_CONFIG_PATH
          export PKG_CONFIG_LIBDIR=/nonexistent
          export PYLZ4_USE_SYSTEM_LZ4=False
          # Name Pillow explicitly so pip forwards these feature settings to its build backend.
          python -m pip install --target "$PROJECT_DIR/PythonApp/site-packages" \
            -C zlib=disable \
            -C jpeg=disable \
            -C tiff=disable \
            -C freetype=disable \
            -C raqm=disable \
            -C lcms=disable \
            -C webp=disable \
            -C jpeg2000=disable \
            -C imagequant=disable \
            -C xcb=disable \
            "Pillow>=10.0.0,<12" \
            -r requirements-ios.txt
          while IFS= read -r -d '' module; do
            description="$(file -b "$module")"
            if [[ "$description" == *"Mach-O"* ]] && [[ "$description" != *"arm64"* ]]; then
              echo "Unexpected non-ARM64 native Python module: $module ($description)" >&2
              exit 1
            fi
          done < <(find PythonApp/site-packages -type f \( -name '*.so' -o -name '*.dylib' \) -print0)
          python tools/check_ios_project.py

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate --spec project.yml

      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild \
            -project MLBBiOSConverter.xcodeproj \
            -scheme MLBBiOSConverter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$PROJECT_DIR/build/DerivedData/Build/Products/Release-iphoneos/ishamlbbios.app"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          # Set version keys on the final bundle as a last-line safeguard for TrollStore.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.0' "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 1.0.0' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1' "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$APP_PATH/Info.plist"
          plutil -lint "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Frameworks/Python.framework/Python"
          # Explicitly place the Python engine, site-packages and bundled shaders inside
          # the app bundle. XcodeGen may treat this directory as a group, not a copied folder.
          rm -rf "$APP_PATH/PythonApp" "$APP_PATH/python"
          ditto "$PROJECT_DIR/PythonApp" "$APP_PATH/PythonApp"
          # Bundle the iOS Python support slice (runtime + ARM64 iOS extension modules).
          ditto "$PROJECT_DIR/Vendor/Python.xcframework/ios-arm64" "$APP_PATH/python"
          # Python-Apple-support's iOS slice does not ship the pure-Python stdlib at
          # $PYTHONHOME/lib/python3.12. Copy it from the matching host Python 3.12 install,
          # excluding host-only native modules and test/development packages.
          HOST_STDLIB="$(python -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')"
          test -d "$HOST_STDLIB/encodings"
          mkdir -p "$APP_PATH/python/lib/python3.12"
          rsync -a \
            --exclude 'lib-dynload/' \
            --exclude 'site-packages/' \
            --exclude 'dist-packages/' \
            --exclude 'test/' \
            --exclude 'tests/' \
            --exclude 'tkinter/' \
            --exclude 'idlelib/' \
            --exclude 'ensurepip/' \
            --exclude 'venv/' \
            "$HOST_STDLIB/" "$APP_PATH/python/lib/python3.12/"
          # Install only iOS ARM64 extension modules at the runtime's importable path.
          IOS_DYNLOAD="$APP_PATH/python/lib-arm64/python3.12/lib-dynload"
          test -d "$IOS_DYNLOAD"
          mkdir -p "$APP_PATH/python/lib/python3.12/lib-dynload"
          ditto "$IOS_DYNLOAD" "$APP_PATH/python/lib/python3.12/lib-dynload"
          test -f "$APP_PATH/python/lib/python3.12/encodings/__init__.py"
          test -f "$APP_PATH/python/lib/python3.12/os.py"
          test -f "$APP_PATH/PythonApp/mlbb_ios_bridge.py"
          test -f "$APP_PATH/PythonApp/site-packages/UnityPy/__init__.py"
          test -f "$APP_PATH/PythonApp/ios_shaders/ShaderVariants.unity3d"
          test -d "$APP_PATH/python/lib"
          test -d "$APP_PATH/python/Python.framework"
          echo "Verified embedded Python framework, complete Python home, Python source, dependencies and shader assets."
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA for testing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/ishamlbbios.app
          APP_BUNDLE="$PWD/build/ipa/Payload/ishamlbbios.app"
          # UnityPy ships host-only FMOD libraries for Linux and macOS.
          # They are not needed for iOS asset conversion and can break TrollStore's recursive signer.
          rm -rf "$APP_BUNDLE/PythonApp/site-packages/UnityPy/lib/FMOD"
          # Remove a build-only universal Mach-O object that TrollStore's recursive
          # signer may mistake for a loadable executable.
          rm -f "$APP_BUNDLE/python/lib/python3.12/config-3.12-darwin/python.o"
          # Thin Python framework binaries to plain arm64 Mach-O headers. The vendor
          # framework contains one-arm64 fat wrappers (CAFEBABE) that ldid may reject.
          while IFS= read -r -d '' candidate; do
            description="$(file -b "$candidate")"
            if [[ "$description" == *"Mach-O universal binary"* ]]; then
              # lipo -verify_arch can return nonzero on some single-slice fat wrappers,
              # even though lipo -info reports an arm64 slice. Use the reported arch list.
              lipo_info="$(lipo -info "$candidate" 2>&1)" || {
                echo "::error::Could not inspect universal Mach-O: $candidate ($lipo_info)"
                exit 1
              }
              if [[ "$lipo_info" == *"arm64"* ]]; then
                temp_file="${candidate}.arm64"
                lipo "$candidate" -thin arm64 -output "$temp_file"
                file -b "$temp_file" | grep -q 'Mach-O' || {
                  echo "::error::Thinned output is not Mach-O: $candidate"
                  exit 1
                }
                mv "$temp_file" "$candidate"
                echo "Thinned universal Mach-O to arm64: $candidate"
              else
                echo "::error::Universal Mach-O has no arm64 slice: $candidate ($lipo_info)"
                exit 1
              fi
            fi
          done < <(find "$APP_BUNDLE" -type f -print0)
          # Ensure non-Mach-O payloads are not marked as executable bundle code.
          while IFS= read -r -d '' candidate; do
            if [ -x "$candidate" ]; then
              description="$(file -b "$candidate")"
              if [[ "$description" != *"Mach-O"* ]]; then
                chmod a-x "$candidate"
                echo "Removed executable bit from non-Mach-O payload: $candidate ($description)"
              fi
            fi
          done < <(find "$APP_BUNDLE" -type f -print0)
          if find "$APP_BUNDLE" -type f -perm -111 -exec file -b {} \; | grep -q 'ELF'; then
            echo "::error::ELF executable remains in the iOS app bundle."
            exit 1
          fi
          ldid -S "$APP_BUNDLE/ishamlbbios"
          test -s "$APP_BUNDLE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Info.plist"
          (cd build/ipa && zip -qr ../ishamlbbios.ipa Payload)
          test -s build/ishamlbbios.ipa
          unzip -t build/ishamlbbios.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-iOS-Converter-IPA
          path: source/MLBB_iOS_Converter_Offline_Project/build/ishamlbbios.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-iOS-Converter-build-diagnostics
          path: |
            source/MLBB_iOS_Converter_Offline_Project/build/DerivedData/Logs/**
            source/MLBB_iOS_Converter_Offline_Project/build/DerivedData/Build/Logs/**
          if-no-files-found: ignore
          retention-days: 7
